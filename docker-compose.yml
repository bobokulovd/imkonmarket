# Ishga tushirish: cp .env.example .env && docker compose up -d --build
# Keyin: docker compose exec backend python manage.py seed --passwords-from /data/loginlar.xlsx
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ustabozor
      POSTGRES_USER: ustabozor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ustabozor}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_DB: ustabozor
      POSTGRES_USER: ustabozor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ustabozor}
      POSTGRES_HOST: db
    volumes:
      - media:/app/media
      - ./data:/data
    depends_on: [db]
    ports: ["8000:8000"]
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
    depends_on: [backend]
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  pgdata:
  media:
